aid: trucksmarter
name: TruckSmarter
description: >-
  TruckSmarter is a free load board and AI dispatch platform for truck drivers
  and owner operators, surfacing 100K+ daily available loads with no
  subscription fees, alongside fuel savings and factoring services and a
  chat-based AI dispatcher (Dispatch). Brokers post loads and book carriers
  through a broker portal, CSV/Excel upload, or the partner Load Posting API,
  which lets partners programmatically create, update, and remove freight
  loads using a Bearer API key.
